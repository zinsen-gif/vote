<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인생그래프 베스트 투표</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard Variable", Pretendard, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; padding: 20px 12px 110px; display: flex; flex-direction: column; align-items: center; }

        .header-area { text-align: center; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .brand-logo-container { display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
        .brand-logo { height: 32px; width: auto; object-fit: contain; }

        .header-area h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .header-area p { font-size: 14px; color: #334155; word-break: keep-all; margin-bottom: 6px; font-weight: 600; }
        
        .notice-text {
            font-size: 12px; color: #ef4444; font-weight: 600; word-break: keep-all; margin-bottom: 16px;
            background: #fef2f2; padding: 8px 12px; border-radius: 8px; border: 1px solid #fee2e2;
            display: inline-block;
        }

        .vote-progress-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px;
            padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            text-align: left; margin-bottom: 8px;
        }

        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .progress-title { font-size: 13px; font-weight: 700; color: #334155; display: flex; align-items: center; gap: 4px; }
        .progress-stats { font-size: 14px; font-weight: 800; color: #2563eb; }
        .progress-percent { font-size: 15px; font-weight: 800; color: #0284c7; }

        .total-progress-track {
            width: 100%; height: 10px; background-color: #f1f5f9;
            border-radius: 999px; overflow: hidden;
        }

        .total-progress-bar {
            height: 100%; background: linear-gradient(90deg, #3b82f6 0%, #0284c7 100%);
            width: 0%; transition: width 0.4s ease; border-radius: 999px;
        }

        .sync-indicator { font-size: 10px; color: #64748b; margin-top: 4px; text-align: right; }

        .admin-dashboard-header {
            display: none; background: #0f172a; color: #38bdf8; padding: 10px 16px;
            border-radius: 10px; margin-top: 12px; font-size: 13px; font-weight: 700; text-align: center;
        }

        .ranking-section {
            display: none; width: 100%; max-width: 800px; background: #ffffff;
            border: 2px solid #3b82f6; border-radius: 16px; padding: 16px;
            margin-top: 16px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.12);
        }

        .ranking-title { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .ranking-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

        .rank-card {
            background: #f8fafc; border-radius: 12px; border: 1px solid #cbd5e1;
            padding: 8px; display: flex; flex-direction: column; align-items: center;
            position: relative; text-align: center;
        }

        .rank-card.rank-1 { border-color: #f59e0b; background: #fffbeb; }
        .rank-card.rank-2 { border-color: #94a3b8; background: #f1f5f9; }
        .rank-card.rank-3 { border-color: #d97706; background: #fff7ed; }

        .rank-badge {
            font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
            margin-bottom: 6px; color: #ffffff;
        }
        .rank-1 .rank-badge { background: #f59e0b; }
        .rank-2 .rank-badge { background: #64748b; }
        .rank-3 .rank-badge { background: #d97706; }

        .rank-img-container {
            width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden;
            position: relative; background: #e2e8f0; margin-bottom: 6px;
        }
        .rank-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .rank-name { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; }
        .rank-votes { font-size: 12px; font-weight: 800; color: #2563eb; }

        .card-grid {
            width: 100%; max-width: 800px; display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px; margin-bottom: 20px;
        }

        @media (min-width: 600px) {
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        }

        .candidate-card {
            background: #ffffff; border-radius: 16px; border: 2px solid #e2e8f0;
            overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column; position: relative;
        }

        .candidate-card:active { transform: scale(0.98); }
        .candidate-card.selected { border-color: #2563eb; background-color: #eff6ff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

        .select-check-badge {
            position: absolute; top: 8px; left: 8px;
            background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 800;
            padding: 3px 8px; border-radius: 999px; display: none; z-index: 5;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
        }
        .candidate-card.selected .select-check-badge { display: block; }

        .img-container {
            width: 100%; aspect-ratio: 4 / 3; background-color: #f1f5f9; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .zoom-btn {
            position: absolute; top: 6px; right: 6px;
            background: rgba(15, 23, 42, 0.7); color: #ffffff;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; border: none; cursor: pointer;
            backdrop-filter: blur(4px); z-index: 5; transition: background 0.2s, transform 0.2s;
        }

        .zoom-btn:active { transform: scale(0.9); background: rgba(37, 99, 235, 0.9); }

        .card-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
        .name-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .name-wrapper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .name { font-size: 15px; font-weight: 700; color: #0f172a; }
        
        .dept-badge {
            font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
            white-space: nowrap; display: inline-block;
        }
        .dept-mkt1 { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .dept-mkt2 { background-color: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .dept-mkt3 { background-color: #fefce8; color: #a16207; border: 1px solid #fef08a; }
        .dept-pm   { background-color: #fdf2f8; color: #be185d; border: 1px solid #fbcfe8; }
        .dept-md   { background-color: #faf5ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        .dept-biz  { background-color: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
        .dept-king { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; font-size: 12px; padding: 1px 5px; }

        .votes-info { font-size: 12px; font-weight: 700; color: #2563eb; display: none; }
        .progress-track { width: 100%; height: 5px; background: #e2e8f0; border-radius: 999px; overflow: hidden; display: none; margin-top: 3px; }
        .progress-bar { height: 100%; background: #2563eb; width: 0%; transition: width 0.3s; }

        .bottom-action {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
            padding: 12px 16px 20px; box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }

        .btn-vote {
            width: 100%; max-width: 500px; padding: 15px; background: #2563eb; color: #ffffff;
            font-size: 16px; font-weight: 700; border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: all 0.2s;
        }

        .btn-vote:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        .voted-notice {
            font-size: 12px; color: #dc2626; font-weight: 700; background: #fef2f2;
            padding: 5px 12px; border-radius: 6px; display: none;
        }

        .admin-controls { display: flex; gap: 12px; }
        .admin-btn { font-size: 11px; color: #94a3b8; background: none; border: none; cursor: pointer; text-decoration: underline; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9); z-index: 1000;
            justify-content: center; align-items: center; padding: 16px;
            backdrop-filter: blur(5px); animation: fadeIn 0.2s ease;
        }

        .modal-container {
            position: relative; max-width: 95%; max-height: 90%;
            display: flex; flex-direction: column; align-items: center;
        }

        .modal-img {
            max-width: 100%; max-height: 80vh; object-fit: contain;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-title { color: #ffffff; font-size: 18px; font-weight: 700; margin-top: 12px; text-align: center; }

        .modal-close {
            position: absolute; top: -45px; right: 0;
            background: rgba(255,255,255,0.2); color: #fff;
            border: none; font-size: 20px; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .password-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(4px); animation: fadeIn 0.2s ease;
        }

        .password-modal-card {
            background: #ffffff; width: 100%; max-width: 320px; border-radius: 16px;
            padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex;
            flex-direction: column; gap: 14px;
        }

        .password-modal-title { font-size: 16px; font-weight: 800; color: #0f172a; text-align: center; }

        .password-input {
            width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-size: 18px; text-align: center; letter-spacing: 4px; outline: none;
            transition: border-color 0.2s;
        }

        .password-input:focus { border-color: #2563eb; }

        .password-btn-group { display: flex; gap: 8px; }

        .password-btn {
            flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700;
            border: none; cursor: pointer;
        }

        .password-btn-confirm { background: #2563eb; color: #ffffff; }
        .password-btn-cancel { background: #f1f5f9; color: #64748b; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header-area">
        <div class="brand-logo-container">
            <img src="./logo.png" alt="EGNIS 로고" class="brand-logo" onerror="if(this.src.endsWith('.png')){this.src='./logo.jpg';}">
        </div>

        <h1>🎨 헬스케어사업부문 배 인생그래프 투표</h1>
        <p>인생그래프를 확인한 후, 인상 깊은 2명을 선택해 투표해주세요!</p>
        <div class="notice-text">*주의사항 : 본인은 제외하고 뽑아주세요. 기기당 1회만 투표 가능합니다.</div>
        
        <div class="vote-progress-card">
            <div class="progress-header">
                <span class="progress-title">📈 투표 진행 현황</span>
                <div>
                    <span class="progress-stats" id="progressStats">0 / 28명</span>
                    <span class="progress-percent" id="progressPercent">(0%)</span>
                </div>
            </div>
            <div class="total-progress-track">
                <div class="total-progress-bar" id="totalProgressBar"></div>
            </div>
            <div class="sync-indicator" id="syncStatus">🔄 실시간 데이터 동기화 중...</div>
        </div>

        <div class="admin-dashboard-header" id="adminHeader">🔒 관리자 모드: 실시간 집계 현황 및 Top 3 공개 중</div>

        <div class="ranking-section" id="rankingSection">
            <div class="ranking-title">🏆 현재 실시간 Top 3 랭킹</div>
            <div class="ranking-grid" id="rankingGrid"></div>
        </div>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="bottom-action">
        <div class="voted-notice" id="votedNotice">이 기기에서는 이미 투표를 완료하셨습니다.</div>
        <button class="btn-vote" id="voteButton" onclick="handleVote()" disabled>후보 2명을 선택해 주세요 (0/2)</button>
        
        <div class="admin-controls">
            <button class="admin-btn" onclick="toggleAdminMode()">관리자 결과 보기</button>
            <button class="admin-btn" onclick="resetAllData()">데이터 초기화</button>
        </div>
    </div>

    <div class="modal-overlay" id="imageModal" onclick="closeModal()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img class="modal-img" id="modalImg" src="" alt="인생그래프 확대">
            <div class="modal-title" id="modalTitle"></div>
        </div>
    </div>

    <div class="password-modal-overlay" id="passwordModal">
        <div class="password-modal-card">
            <div class="password-modal-title" id="pwModalTitle">관리자 비밀번호 입력</div>
            <input type="password" class="password-input" id="pwInput" placeholder="••••••••" autocomplete="off">
            <div class="password-btn-group">
                <button class="password-btn password-btn-cancel" onclick="closePwModal()">취소</button>
                <button class="password-btn password-btn-confirm" onclick="submitPwModal()">확인</button>
            </div>
        </div>
    </div>

<script>
    const ADMIN_PASSWORD = "10011001";
    const TOTAL_TARGET_VOTERS = 28;
    const MAX_SELECTION = 2;

    // 온라인 공유 데이터베이스 API (JSONBin)
    const JSONBIN_BIN_ID = '67384a51ad19ca34f8cb6440';
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    const rawMembers = [
        { name: "김호균", team: "👑" }, { name: "정기흥", team: "마케팅1팀" }, { name: "이정근", team: "마케팅2팀" },
        { name: "김주연", team: "마케팅3팀" }, { name: "김재광", team: "상품기획팀" }, { name: "김미희", team: "온라인MD팀" },
        { name: "박진선", team: "마케팅1팀" }, { name: "이상원", team: "마케팅1팀" }, { name: "주예진", team: "마케팅1팀" },
        { name: "김혜정", team: "마케팅2팀" }, { name: "최우정", team: "마케팅3팀" }, { name: "이미연", team: "마케팅1팀" },
        { name: "김예린", team: "온라인MD팀" }, { name: "홍주영", team: "상품기획팀" }, { name: "맹원영", team: "온라인MD팀" },
        { name: "김채은", team: "마케팅2팀" }, { name: "윤수현", team: "사업기획팀" }, { name: "강민석", team: "마케팅2팀" },
        { name: "이슬비", team: "마케팅2팀" }, { name: "김보민", team: "마케팅3팀" }, { name: "서지우", team: "마케팅1팀" },
        { name: "이가연", team: "마케팅1팀" }, { name: "이민주", team: "마케팅2팀" }, { name: "이하은", team: "마케팅1팀" },
        { name: "김은아", team: "상품기획팀" }, { name: "박민지", team: "상품기획팀" }, { name: "권성현", team: "사업기획팀" },
        { name: "김리아", team: "마케팅1팀" }
    ];

    const membersData = rawMembers.sort((a, b) => a.name.localeCompare(b.name, 'ko'));

    let globalCandidateList = [];
    let globalVotedDevices = [];
    let selectedIds = [];
    let isAdminMode = false;
    let pwActionType = 'admin';

    function getDeptClass(team) {
        switch(team) {
            case "👑": return "dept-king";
            case "마케팅1팀": return "dept-mkt1";
            case "마케팅2팀": return "dept-mkt2";
            case "마케팅3팀": return "dept-mkt3";
            case "상품기획팀": return "dept-pm";
            case "온라인MD팀": return "dept-md";
            case "사업기획팀": return "dept-biz";
            default: return "dept-none";
        }
    }

    function getDeviceId() {
        let deviceId = localStorage.getItem('egnis_device_uuid_v3');
        if (!deviceId) {
            deviceId = 'device_' + Math.random().toString(36).substring(2, 11) + Date.now();
            localStorage.setItem('egnis_device_uuid_v3', deviceId);
        }
        return deviceId;
    }

    function initDefaultData() {
        return membersData.map((item, idx) => ({
            id: idx + 1,
            name: item.name,
            team: item.team,
            image: `./${item.name}.jpg`,
            votes: 0
        }));
    }

    // 온라인 서버 데이터 동기화 함수
    async function fetchServerData() {
        try {
            const res = await fetch(`${JSONBIN_URL}/latest?meta=false`, {
                headers: { 'X-Master-Key': '$2a$10$954P5A.w2o7S3X1oI3T7.eIuY4p1G/q1O2eL8Z/w7K7M9w7N5.O5K' } // 공개 읽기용
            });
            if (res.ok) {
                const data = await res.json();
                if (data && Array.isArray(data.candidates)) {
                    globalCandidateList = data.candidates;
                    globalVotedDevices = data.devices || [];
                } else {
                    globalCandidateList = initDefaultData();
                }
            } else {
                globalCandidateList = initDefaultData();
            }
        } catch (e) {
            console.log("로컬 데이터로 작동 중");
            if (globalCandidateList.length === 0) {
                globalCandidateList = initDefaultData();
            }
        }
        renderView();
    }

    async function saveServerData(newList, newDevices) {
        globalCandidateList = newList;
        globalVotedDevices = newDevices;
        renderView();

        try {
            await fetch(JSONBIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': '$2a$10$954P5A.w2o7S3X1oI3T7.eIuY4p1G/q1O2eL8Z/w7K7M9w7N5.O5K'
                },
                body: JSON.stringify({ candidates: newList, devices: newDevices })
            });
            document.getElementById('syncStatus').textContent = "✅ 실시간 동기화 완료";
        } catch (e) {
            document.getElementById('syncStatus').textContent = "⚠️ 서버 저장 중..";
        }
    }

    function checkHasVoted() {
        const deviceId = getDeviceId();
        return globalVotedDevices.includes(deviceId) || localStorage.getItem('egnis_voted_local_v3') === 'true';
    }

    function renderView() {
        const currentVoterCount = globalVotedDevices.length;
        const cardGrid = document.getElementById('cardGrid');
        const voteBtn = document.getElementById('voteButton');
        const votedNotice = document.getElementById('votedNotice');
        const adminHeader = document.getElementById('adminHeader');
        const rankingSection = document.getElementById('rankingSection');
        const rankingGrid = document.getElementById('rankingGrid');
        const hasVoted = checkHasVoted();

        const progressPercent = Math.min(Math.round((currentVoterCount / TOTAL_TARGET_VOTERS) * 100), 100);
        document.getElementById('progressStats').textContent = `${currentVoterCount} / ${TOTAL_TARGET_VOTERS}명`;
        document.getElementById('progressPercent').textContent = `(${progressPercent}%)`;
        document.getElementById('totalProgressBar').style.width = `${progressPercent}%`;

        adminHeader.style.display = isAdminMode ? 'block' : 'none';
        rankingSection.style.display = isAdminMode ? 'block' : 'none';

        if (isAdminMode) {
            const sortedByVotes = [...globalCandidateList].sort((a, b) => b.votes - a.votes);
            const top3 = sortedByVotes.slice(0, 3);
            
            rankingGrid.innerHTML = '';
            top3.forEach((item, index) => {
                const rankNum = index + 1;
                const percentage = currentVoterCount > 0 ? Math.round((item.votes / currentVoterCount) * 100) : 0;
                const rankLabels = ["🥇 1위", "🥈 2위", "🥉 3위"];
                const deptClass = getDeptClass(item.team);

                const rankCard = document.createElement('div');
                rankCard.className = `rank-card rank-${rankNum}`;
                rankCard.innerHTML = `
                    <div class="rank-badge">${rankLabels[index]}</div>
                    <div class="rank-img-container">
                        <button class="zoom-btn" onclick="openModal('${item.image}', '${item.name}'); event.stopPropagation();">🔍</button>
                        <img src="${item.image}" alt="${item.name}" onerror="if(this.src.endsWith('.jpg')){this.src='./${item.name}.png';}">
                    </div>
                    <div class="rank-name">
                        ${item.name}
                        <span class="dept-badge ${deptClass}">${item.team}</span>
                    </div>
                    <div class="rank-votes">${item.votes}표 (${percentage}%)</div>
                `;
                rankingGrid.appendChild(rankCard);
            });
        }

        cardGrid.innerHTML = '';

        globalCandidateList.forEach(c => {
            const isSelected = selectedIds.includes(c.id);
            const percentage = currentVoterCount > 0 ? Math.round((c.votes / currentVoterCount) * 100) : 0;
            const deptClass = getDeptClass(c.team);
            const card = document.createElement('div');
            card.className = `candidate-card ${isSelected ? 'selected' : ''}`;
            
            if (!hasVoted) {
                card.onclick = () => selectCard(c.id);
            }

            card.innerHTML = `
                <span class="select-check-badge">✓ 선택됨</span>
                <div class="img-container">
                    <button class="zoom-btn" onclick="openModal('${c.image}', '${c.name}'); event.stopPropagation();" title="확대보기">🔍</button>
                    <img src="${c.image}" alt="${c.name}" onerror="if (this.src.endsWith('.jpg')) { this.src='./${c.name}.png'; } else { this.parentElement.innerHTML='<button class=\\'zoom-btn\\' onclick=\\'event.stopPropagation();\\'>🔍</button><span style=\\'font-weight:bold;color:#94a3b8;font-size:12px;\\'>${c.name}</span>'; }">
                </div>
                <div class="card-body">
                    <div class="name-row">
                        <div class="name-wrapper">
                            <span class="name">${c.name}</span>
                            <span class="dept-badge ${deptClass}">${c.team}</span>
                        </div>
                        <span class="votes-info" style="display: ${isAdminMode ? 'inline' : 'none'}">${c.votes}표 (${percentage}%)</span>
                    </div>
                    <div class="progress-track" style="display: ${isAdminMode ? 'block' : 'none'}">
                        <div class="progress-bar" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
            cardGrid.appendChild(card);
        });

        if (hasVoted) {
            voteBtn.disabled = true;
            voteBtn.textContent = "투표 완료됨";
            votedNotice.style.display = 'block';
        } else {
            votedNotice.style.display = 'none';
            if (selectedIds.length === 0) {
                voteBtn.disabled = true;
                voteBtn.textContent = "후보 2명을 선택해 주세요 (0/2)";
            } else if (selectedIds.length === 1) {
                voteBtn.disabled = false;
                const target1 = globalCandidateList.find(c => c.id === selectedIds[0]);
                voteBtn.textContent = `[${target1.name}] 1명 선택됨 (1/2명 투표 가능)`;
            } else if (selectedIds.length === 2) {
                voteBtn.disabled = false;
                const target1 = globalCandidateList.find(c => c.id === selectedIds[0]);
                const target2 = globalCandidateList.find(c => c.id === selectedIds[1]);
                voteBtn.textContent = `[${target1.name}, ${target2.name}] 2명 투표하기`;
            }
        }
    }

    function selectCard(id) {
        if (checkHasVoted()) return;

        const index = selectedIds.indexOf(id);
        if (index > -1) {
            selectedIds.splice(index, 1);
        } else {
            if (selectedIds.length >= MAX_SELECTION) {
                alert("투표는 최대 2명까지만 선택할 수 있습니다.");
                return;
            }
            selectedIds.push(id);
        }
        renderView();
    }

    async function handleVote() {
        if (selectedIds.length === 0 || checkHasVoted()) return;

        const updatedList = [...globalCandidateList];
        const selectedNames = [];

        selectedIds.forEach(id => {
            const target = updatedList.find(c => c.id === id);
            if (target) {
                target.votes = (target.votes || 0) + 1;
                selectedNames.push(target.name);
            }
        });

        const deviceId = getDeviceId();
        const updatedDevices = [...globalVotedDevices];
        if (!updatedDevices.includes(deviceId)) {
            updatedDevices.push(deviceId);
        }
        
        localStorage.setItem('egnis_voted_local_v3', 'true');
        selectedIds = [];
        
        await saveServerData(updatedList, updatedDevices);
        alert(`[${selectedNames.join(', ')}] 님에게 투표가 정상적으로 완료되었습니다!`);
    }

    function toggleAdminMode() {
        if (isAdminMode) {
            isAdminMode = false;
            renderView();
            return;
        }
        pwActionType = 'admin';
        document.getElementById('pwModalTitle').textContent = "관리자 비밀번호 입력";
        openPwModal();
    }

    function resetAllData() {
        pwActionType = 'reset';
        document.getElementById('pwModalTitle').textContent = "초기화 비밀번호 입력";
        openPwModal();
    }

    function openPwModal() {
        const input = document.getElementById('pwInput');
        input.value = '';
        document.getElementById('passwordModal').style.display = 'flex';
        input.focus();
    }

    function closePwModal() {
        document.getElementById('passwordModal').style.display = 'none';
    }

    async function submitPwModal() {
        const inputPw = document.getElementById('pwInput').value;
        closePwModal();

        if (inputPw === ADMIN_PASSWORD) {
            if (pwActionType === 'admin') {
                isAdminMode = true;
                renderView();
            } else if (pwActionType === 'reset') {
                if (confirm("모든 기기의 투표 기록을 초기화하시겠습니까?")) {
                    localStorage.removeItem('egnis_voted_local_v3');
                    selectedIds = [];
                    isAdminMode = false;
                    await saveServerData(initDefaultData(), []);
                    alert("전체 서버 데이터가 초기화되었습니다.");
                }
            }
        } else {
            alert("비밀번호가 올바르지 않습니다.");
        }
    }

    document.getElementById('pwInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') submitPwModal();
    });

    function openModal(imgSrc, name) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        modalImg.src = imgSrc;
        modalTitle.textContent = `${name} 님의 인생그래프`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    // 3초마다 모든 휴대폰/PC의 투표 집계 자동 갱신 (실시간 누적 반영)
    setInterval(fetchServerData, 3000);
    fetchServerData();
</script>

</body>
</html>
